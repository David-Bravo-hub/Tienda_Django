{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Contacto - Tiendita Belén</title>
    <link rel="stylesheet" href="{% static 'tienda/styles.css' %}">
</head>
<body style="font-family: Arial, sans-serif; background-color: #fff0f5; color: #333; margin: 0; padding: 0;">
    <header style="background-color: #ffb6c1; padding: 20px; text-align: center;">
        <h1 style="color: #d14770; margin: 0;">Tiendita Belén</h1>

    <main style="padding: 40px; text-align: center;">

            <p style="font-size: 16px; line-height: 1.6; color: #555; margin-bottom: 20px;">
