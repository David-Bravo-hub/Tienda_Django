<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Producto - Tienda</title>
</head>
<body>
    <h1>Editar Producto</h1>
    <form method="POST">
        {% csrf_token %}
        <label>Nombre:</label><br>
        <input type="text" name="nombre" value="{{ producto.nombre }}" required><br><br>

        <label>Precio:</label><br>
        <input type="number" name="precio" value="{{ producto.precio }}" required><br><br>

        <label>Stock:</label><br>
        <input type="number" name="stock" value="{{ producto.stock }}" required><br><br>

        <label>Descripción:</label><br>
        <textarea name="descripcion" required>{{ producto.descripcion }}</textarea><br><br>

        <button type="submit">Actualizar Producto</button>
    </form>
    <br>
    <a href="{% url 'inicio' %}">Volver al inicio</a>
</body>
</html>
